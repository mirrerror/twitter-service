ai-generated-tweets-to-kafka-service:
  streaming-data-keywords:
    - Java
    - Microservices
    - Spring
    - Kafka
    - Elasticsearch
  ai-service: SpringAI-DeepSeek
  scheduler-duration-sec: 30
  prompt: "Generate a json with 4 elements called createdAt, id, text and user. The user element has also a nested json element called id. For createdAt use a date in format 'EEE MMM dd HH:mm:ss zzz yyyy', example date would be 'Fri Oct 06 14:32:25 UTC 2023', for id use a java long value, for text use a string including one or more of the keywords: {keywords}. For id field of the user field use a java long value. Do not write anything on the response other than the json text. That means omit ```json part in the response and any other explanation. Do not use new lines in the response. Do not include the L letter at the end of the long values. Only give 1 result in the response."
  keywords-placeholder: '{keywords}'
  open-ai:
    url: "http://localhost:11434/v1/chat/completions"
    api-key: ${OPENAI_API_KEY}
    content-type: "application/json"
    model: "llama3.2"
    max-completion-tokens: 150
    temperature: 1
    messages:
      - role: "user"
        content:
          -
            type: "text"
  google-gen-ai:
    projectId: 'projectId'
    location: 'location'
    modelName: 'modelName'
    max-output-tokens: 150
    temperature: 1
    candidate-count: 1

spring:
  ai:
    openai:
#      api-key: ${OPENAI_API_KEY}
      api-key: ${DEEPSEEK_API_KEY}
#      base-url: "http://localhost:11434/v1"
      base-url: "https://api.deepseek.com"
      chat:
#        model: "llama3.2"
        model: "deepseek/chat"
        temperature: 1
        max-tokens: 150
    ollama:
      base-url: 'http://localhost:11434'
      chat:
        model: "deepseek-r1:14b"
        temperature: 1
        max-new-tokens: 150

retry-config:
  initial-interval-ms: 1000
  max-interval-ms: 10000
  multiplier: 2.0
  max-attempts: 3
  sleep-time-ms: 2000

kafka-config:
  bootstrap-servers: 'localhost:19092, localhost:29092, localhost:39092'
  schema-registry-url-key: schema.registry.url
  schema-registry-url: 'http://localhost:8081'
  topic-name: 'twitter-topic'
  topic-names-to-create:
    - twitter-topic
  num-of-partitions: 3
  replication-factor: 3

kafka-producer-config:
  key-serializer-class: org.apache.kafka.common.serialization.LongSerializer
  value-serializer-class: io.confluent.kafka.serializers.KafkaAvroSerializer
  compression-type: snappy
  acks: all
  batch-size: 16384
  batch-size-boost-factor: 100
  linger-ms: 5
  request-timeout-ms: 60000
  retry-count: 5